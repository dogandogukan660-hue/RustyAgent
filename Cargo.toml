[package]
name = "rusty-agent"
version = "0.1.0"
edition = "2024"
default-run = "rusty-agent"

# Yayın sürümü: hızlı ve küçük (hata ayıklama bilgisi yok, semboller ayıklanır)
[profile.release]
opt-level = 3
strip = true
debug = false

# Geliştirme sürümü: derleme klasörü şişmesin diye hata ayıklama bilgisi en azda
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[lib]
name = "rusty_agent"
path = "src/lib.rs"

# Komut satırı: run, tui, serve, mcp, skill, plugin… (argümansız çalıştırınca da uygulamayı açar)
[[bin]]
name = "rusty-agent"
path = "src/main.rs"

# Masaüstü uygulaması: konsol penceresi açmaz (çift tıklayarak başlatılacak olan bu)
[[bin]]
name = "RustyAgent"
path = "src/gui_main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "form"] }
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
cron = "0.17.0"
crossterm = "0.29.0"
dirs = "7.0.0"
eframe = "0.37.0"
enigo = "0.6.1"
futures = "0.3.34"
glob = "0.3.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
open = "5.4.5"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "query", "form", "multipart"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.2.1"
uuid = { version = "1.29.2", features = ["v4"] }
walkdir = "2.5.0"
xcap = "0.9.10"
